<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>fboat25 · reels</title>
<style>
:root{--bg:#000;--ink:#f5f5f5;--mute:#a8a8a8;--line:#262626}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.wrap{max-width:935px;margin:0 auto}
/* profile header */
.top{display:flex;align-items:center;gap:28px;padding:28px 16px 20px}
.ava{flex:none;width:86px;height:86px;border-radius:50%;padding:3px;background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
.ava img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg);display:block}
.who{display:flex;flex-direction:column;gap:10px;min-width:0}
.row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nick{font-size:20px;font-weight:400}
.btn{background:#0095f6;color:#fff;font-weight:600;font-size:14px;padding:7px 16px;border-radius:8px}
.btn:hover{background:#1877f2}
.stats{display:flex;gap:24px;color:var(--ink)}
.stats b{font-weight:600}
.bio{color:var(--ink)}
/* tabs */
.tabs{display:flex;justify-content:center;border-top:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:6px;padding:14px 0;margin-top:-1px;border-top:1px solid var(--ink);font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.tab svg{width:12px;height:12px}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding-bottom:40px}
.cell{position:relative;aspect-ratio:9/16;background:#121212;overflow:hidden;cursor:pointer}
.cell img,.cell video{width:100%;height:100%;object-fit:cover;display:block}
.cell .ico{position:absolute;top:8px;right:8px;width:18px;height:18px;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.tag{position:absolute;left:8px;top:8px;z-index:2;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:600;letter-spacing:.3px;pointer-events:none}
.slide .tag{left:50%;top:auto;bottom:70px;transform:translateX(-50%);font-size:14px;padding:6px 14px}
.cell:hover::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25)}
/* reels viewer: one video per screen */
.viewer{position:fixed;inset:0;background:#000;z-index:10;display:none}
.viewer.on{display:block}
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slide{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;position:relative}
.slide video{height:100%;max-width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;border-radius:0}
.cap{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;width:min(100%,calc(100dvh*9/16));padding:0 16px;display:flex;align-items:center;gap:10px;pointer-events:none}
.cap img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.cap span{font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.x,.snd{position:fixed;z-index:11;width:40px;height:40px;border-radius:50%;background:rgba(38,38,38,.75);color:#fff;border:0;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.x{top:14px;right:14px}.snd{top:14px;right:62px;font-size:16px}
.tap{position:absolute;inset:0;cursor:pointer}
@media (max-width:735px){
 .top{gap:20px;padding:16px}
 .ava{width:77px;height:77px}
 .nick{font-size:18px}
 .stats{gap:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="ava"><img src="avatar.jpg" alt="fboat25"></div>
    <div class="who">
      <div class="row1"><span class="nick">fboat25</span><a class="btn" href="https://t.me/fboat25">Написать</a></div>
      <div class="stats"><span><b id="cnt">8</b> reels</span></div>
      <div class="bio">AI-рилсы под ключ<br>С ИИ выпускаю ролики в несколько раз быстрее</div>
    </div>
  </header>
  <nav class="tabs"><div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 8h18M9 3l3 5M14 3l3 5M10 12v6l5-3z"/></svg>Reels</div></nav>
  <main class="grid" id="grid"></main>
</div>

<div class="viewer" id="viewer">
  <button class="snd" id="snd" aria-label="Звук">🔊</button>
  <button class="x" id="x" aria-label="Закрыть">✕</button>
  <div class="feed" id="feed"></div>
</div>

<script>
const V=["eif_final","ochf_1","ochf_2","verf_buk","book_cover","siam_r5","siam_r4","edit_realfootage"];
const TAG={verf_buk:'Вариант 1',book_cover:'Вариант 2'};
const tag=n=>TAG[n]?`<span class="tag">${TAG[n]}</span>`:'';
const ICO='<svg class="ico" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';
const grid=document.getElementById('grid'),feed=document.getElementById('feed'),viewer=document.getElementById('viewer'),snd=document.getElementById('snd');
let muted=false;

// grid: posters, short muted preview on hover (desktop)
V.forEach((n,i)=>{
  const c=document.createElement('div');c.className='cell';
  c.innerHTML=`<img src="posters/${n}.jpg" alt="" loading="lazy">${ICO}${tag(n)}`;
  c.onmouseenter=()=>{if(c.querySelector('video'))return;const v=document.createElement('video');Object.assign(v,{src:`videos/${n}.mp4`,muted:true,loop:true,playsInline:true,autoplay:true});v.style.cssText='position:absolute;inset:0';c.prepend(v);};
  c.onmouseleave=()=>{const v=c.querySelector('video');if(v)v.remove();};
  c.onclick=()=>open(i);
  grid.append(c);
});

// viewer: one reel per screen, vertical snap scroll like Reels
V.forEach(n=>{
  const s=document.createElement('section');s.className='slide';
  s.innerHTML=`<video src="videos/${n}.mp4" poster="posters/${n}.jpg" loop playsinline preload="none"></video>${tag(n)}<div class="tap"></div><div class="cap"><img src="avatar.jpg" alt=""><span>fboat25</span></div>`;
  s.querySelector('.tap').onclick=()=>{const v=s.querySelector('video');v.paused?v.play().catch(()=>{}):v.pause();};
  feed.append(s);
});
let cur=-1,tm;
function playAt(i){i=Math.max(0,Math.min(V.length-1,i));if(i===cur)return;cur=i;
  [...feed.children].forEach((sl,k)=>{const v=sl.querySelector('video');
    if(k===i){v.preload='auto';v.muted=muted;v.currentTime=0;v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});});}
    else{v.pause();if(Math.abs(k-i)===1)v.preload='auto';}});}
feed.addEventListener('scroll',()=>{clearTimeout(tm);tm=setTimeout(()=>{if(viewer.classList.contains('on')&&feed.clientHeight)playAt(Math.round(feed.scrollTop/feed.clientHeight));},120);});

function open(i){viewer.classList.add('on');document.body.style.overflow='hidden';
  feed.scrollTop=i*feed.clientHeight;cur=-1;playAt(i);
  history.pushState({v:1},'');}
function close(){viewer.classList.remove('on');document.body.style.overflow='';feed.querySelectorAll('video').forEach(v=>v.pause());cur=-1;}
document.getElementById('x').onclick=()=>history.back();
window.onpopstate=close;
snd.onclick=()=>{muted=!muted;snd.textContent=muted?'🔇':'🔊';feed.querySelectorAll('video').forEach(v=>v.muted=muted);};
document.addEventListener('keydown',e=>{if(!viewer.classList.contains('on'))return;
  if(e.key==='Escape')history.back();
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();feed.scrollBy({top:(e.key==='ArrowDown'?1:-1)*innerHeight,behavior:'smooth'});}});
</script>
</body>
</html>
